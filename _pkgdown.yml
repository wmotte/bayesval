url: https://wmotte.github.io/bayesval/

template:
  bootstrap: 5

home:
  title: bayesval
  description: >
    Bayesian probabilistic validation of Cox proportional-hazards prediction
    models — every discrimination, calibration, and clinical-utility metric
    reported as a posterior distribution with a 95% credible interval.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: "Worked example (Rotterdam → GBSG)"
        href: articles/worked_example.html
      - text: "Showcase: small local cohort"
        href: articles/showcase_small_cohort.html
      - text: "Showcase: Mayo PBC cohort"
        href: articles/showcase_pbc.html
      - text: "-------"
      - text: "Full-Bayes MCMC vs Cox-Laplace (pre-rendered)"
        href: articles/small_sample_stan_vs_laplace.html

